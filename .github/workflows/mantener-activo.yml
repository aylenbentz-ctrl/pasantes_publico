# Evita que Supabase (plan gratuito) pause el proyecto por inactividad.
# Supabase pausa los proyectos gratuitos que pasan 7 días sin uso; esta tarea hace una consulta
# liviana a la base cada 3 días para que cuente como actividad.
#
# Para probarla: pestaña "Actions" del repo > "Mantener Supabase activo" > "Run workflow".
# Ojo: GitHub desactiva las tareas programadas de un repo público si pasan 60 días sin ninguna
# actividad en el repo (un commit, por ejemplo). Si pasa, aparece un botón "Enable workflow"
# en la pestaña Actions y se reactiva con un clic.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 12 */3 * *"     # cada 3 días, 12:17 UTC (09:17 en Argentina)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar la base de datos
        run: |
          # La URL y la clave "publishable" ya son públicas (están en index.html); no son secretas.
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
            -X POST "https://mxwyiiltvmcxayjwrqof.supabase.co/rest/v1/rpc/soy_rrhh" \
            -H "apikey: sb_publishable_lHXjfWCanYeJqCuPSucX7A__3I2Rp0Y" \
            -H "Content-Type: application/json" -d '{}')
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"
